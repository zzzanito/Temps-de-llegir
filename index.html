<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temps de Llegir</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM (Versiones de desarrollo más compatibles con Babel) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para traducir el código sobre la marcha -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@0.300.0/dist/umd/lucide.min.js"></script>

    <!-- Firebase (Cambiamos a la versión 'app' y luego los servicios específicos) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* Pequeño ajuste para asegurar que el fondo se vea mientras carga */
        body { margin: 0; background-color: #f8fafc; }
        .dark body { background-color: #020617; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- El script debe tener el tipo text/babel para que Babel lo procese -->
    <script type="text/babel" src="script.js"></script>

    <script>
        // Este pequeño script ayuda a Lucide a encontrar los iconos en el modo simple
        window.Lucide = window.lucide;
    </script>
</body>
</html>
